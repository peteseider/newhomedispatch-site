# Explicit build command so Netlify actually runs npm install for
# netlify/functions/package.json before bundling the functions. Without
# this, zip-it-and-ship-it can ship get-incentive-feed.js /
# ingest-incentive-feed.js (and _lib/blob-store.js, used by the Twilio
# check-in functions) without @netlify/blobs actually installed, and they
# crash at cold-start with "Cannot find module '@netlify/blobs'" --
# confirmed 2026-08-20. See production/netlify-blobs-dependency-bug-2026-08-20.md.
[build]
  command = "npm install --prefix netlify/functions"
  
  [functions]
  directory = "netlify/functions"

# Runs daily. Netlify scheduled-function cron is UTC — 13:00 UTC is
# 8:00am America/Chicago (7:00am during CDT... adjust if this drifts;
# Netlify does not do timezone-aware cron). Checks rep-contacts for anyone
# due for a check-in and sends via Twilio, IF TWILIO_LIVE_SEND=true.
# See netlify/functions/twilio-checkin-send.js and
# dispatch/twilio-autonomous-checkin-integration.md.
[functions."twilio-checkin-send"]
  schedule = "0 13 * * *"

# Daily Hot Sheet email. Runs every morning after the bridge publishes
# team/hot-sheet-digest.html (~12:00 UTC), emails it to the MailerLite "Daily
# Hot Sheet" group. DRY-RUN (logs only) unless HOTSHEET_EMAIL_LIVE=true in the
# Netlify env. See netlify/functions/send-hot-sheet-email.js.
[functions."send-hot-sheet-email"]
  schedule = "30 12 * * *"

[functions."send-hot-sheet-email-retry"]
  schedule = "30 13 * * *"
