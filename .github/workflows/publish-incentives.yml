name: Publish incentive sweep feed

# Triggered when the Cowork "NHD Live Builder Intelligence Sweep" task pushes
# its daily publishable feed (see reporting/incentive-sweep-daily-prompt-v4.md
# STEP 9b) to reporting/incentive-sweep/publishable-latest.json. Merges that
# feed into incentives.json via scripts/publish-incentives.mjs, gates the
# result through the existing consistency checker, and pushes only if it
# passes. This is the bridge STEP 9b's own comments describe but that never
# existed in this repo until now (added 2026-08-03) -- without it, the daily
# sweep's fresh data had nowhere automated to go and incentives.json was
# going stale for days between manual/attended pushes.

on:
  push:
    branches: [main]
    paths:
      - 'reporting/incentive-sweep/publishable-latest.json'
  workflow_dispatch: # lets you run it on demand from the Actions tab

permissions:
  contents: write # allows the workflow to commit the merged incentives.json

concurrency:
  group: publish-incentives
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Merge sweep feed into incentives.json
        run: node scripts/publish-incentives.mjs

      - name: Consistency gate (must pass before publish)
        run: node check_consistency.cjs

      - name: Commit and push if changed
        run: |
          git config user.name "nhd-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add incentives.json reporting/incentive-sweep/new-page-candidates.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish incentive sweep feed: merge daily builder data"
            git push
          fi
